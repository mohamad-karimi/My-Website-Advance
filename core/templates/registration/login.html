{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body>

<div class="container">

    <div class="form-card">

        <h1>Login</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
