{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body>

<div class="post-form">

    <div class="container">

        <div class="form-card">

            <h1>Create New Post</h1>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Save Post
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
